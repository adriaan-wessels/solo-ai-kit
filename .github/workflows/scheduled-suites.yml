# Scheduled re-run of every suite and every --prove pass on the default
# branch, so environment rot between pushes fails here instead of inside
# the next unrelated PR.
#
# This lives apart from mutation-clock.yml on purpose: the clock is
# DESIGNED to hold a standing red until a campaign lands, and a novel
# failure here must never hide inside that known red (README, principle
# 6, and the lesson it cites). On failure this workflow files (or
# refreshes) a tracker issue, so the red lands where the agents actually
# look instead of relying on anyone's notification settings.
#
# Known drift risk, disclosed: these commands are a hand copy of
# ci.yml's suite steps with no cross-check asserting the two lists
# agree. A suite added there must be added here. The shared-script
# refactor that removes the duplication is tracked on the follow-up
# issue for #59's review round.

name: Scheduled suites

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  suites:
    name: Suites and prove passes
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replay harnesses and selftests
        run: |
          set -eu
          node claude/hooks/guardrail.test.js
          bash claude/hooks/subagent-stall-check.test.sh
          node claude/hooks/session-start.selftest.js
          node claude/hooks/pr-merge-gate.test.js

      - name: Every suite can still fail
        run: |
          set -eu
          node claude/hooks/guardrail.test.js --prove
          node claude/hooks/session-start.selftest.js --prove
          node claude/hooks/pr-merge-gate.test.js --prove

      - name: File or refresh the red-suites issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          title="Scheduled suites are red"
          body="Scheduled run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} . Environment rot or a suite regression on the default branch; triage before trusting any green."
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
