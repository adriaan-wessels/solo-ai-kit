# CI for the kit's own repo.
#
# The kit tells every new project to gate merges on a green required check
# (README, practice 5). This is that check, applied to the kit itself.
#
# Three things run here, cheapest first:
#   1. a syntax check over every script the kit ships;
#   2. the replay harnesses and selftests, which are the only real test
#      suites here: guardrail.test.js, subagent-stall-check.test.sh,
#      session-start.selftest.js, pr-merge-gate.test.js,
#      mutation-clock-check.test.sh and doc-style-check.selftest.js. Each JS
#      suite also runs a --prove pass. That pass reintroduces real defects
#      and requires the suite to go red for each one. A suite that cannot
#      fail is not evidence;
#   3. the doc-style gate over the lines the change adds.
#
# Scope note, kept honest on purpose: this covers claude/ and scripts/ only.
# templates/ is excluded because those files carry <PLACEHOLDER> markers and
# are not meant to parse. For what stays unverified, see claude/README.md,
# "Corpus replay for guards that classify text".
#
# Every step fails loudly when it finds nothing to check. A syntax pass over
# zero files is a vacuous green, which is worse than no check at all
# (README, principle 3).

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check:
    # This name is what branch protection's required-status-check matches.
    name: Hooks and scripts
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The doc-style step diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -eu
          files=$(find claude scripts -name '*.js' -type f | sort)
          [ -n "$files" ] || { echo "::error::no .js files found; this check is vacuous"; exit 1; }
          bad=0
          for f in $files; do
            if node --check "$f"; then echo "ok   $f"; else echo "::error file=$f::JavaScript syntax error"; bad=1; fi
          done
          exit $bad

      - name: Shell syntax
        run: |
          set -eu
          files=$(find claude scripts -name '*.sh' -type f | sort)
          [ -n "$files" ] || { echo "::error::no .sh files found; this check is vacuous"; exit 1; }
          bad=0
          for f in $files; do
            if bash -n "$f"; then echo "ok   $f"; else echo "::error file=$f::shell syntax error"; bad=1; fi
          done
          exit $bad

      - name: JSON syntax
        run: |
          set -eu
          files=$(find claude scripts -name '*.json' -type f | sort)
          [ -n "$files" ] || { echo "::error::no .json files found; this check is vacuous"; exit 1; }
          bad=0
          for f in $files; do
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f"; then echo "ok   $f"; else echo "::error file=$f::invalid JSON"; bad=1; fi
          done
          exit $bad

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path claude,scripts -Recurse -Filter *.ps1
          if ($files.Count -eq 0) { Write-Output "::error::no .ps1 files found; this check is vacuous"; exit 1 }
          $bad = 0
          foreach ($f in $files) {
            $e = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e -and $e.Count) {
              Write-Output "::error file=$($f.FullName)::PowerShell parse error: $($e[0].Message)"
              $bad = 1
            } else {
              Write-Output "ok   $($f.FullName)"
            }
          }
          exit $bad

      - name: Guardrail replay harness
        run: node claude/hooks/guardrail.test.js

      # The slowest step here, and the one worth the wall clock: it
      # reintroduces ten real defects and requires the suite to go red for
      # each. The defect list came from agents that wrote neither the hook
      # nor the suite and could not read any test file, which is what
      # practice 4 asks for (#34). About 90s locally.
      - name: Guardrail suite can fail
        run: node claude/hooks/guardrail.test.js --prove

      - name: Stall-check replay harness
        run: bash claude/hooks/subagent-stall-check.test.sh

      # The mutation clock's decision logic (scripts/mutation-clock-check.sh)
      # is verification machinery too. Its red cases are the controls: a
      # clock that cannot go red is not a clock.
      - name: Mutation-clock check harness
        run: bash scripts/mutation-clock-check.test.sh

      - name: Session-start selftest
        run: node claude/hooks/session-start.selftest.js

      # The suite above is evidence only if it can fail. --prove reintroduces
      # fourteen real defects and requires the suite to go red for each one, so a
      # selftest that has quietly stopped asserting anything fails here
      # instead of passing green forever (README, principle 3).
      - name: Session-start selftest can fail
        run: node claude/hooks/session-start.selftest.js --prove

      - name: PR merge gate replay harness
        run: node claude/hooks/pr-merge-gate.test.js

      # Same reason as the selftest above: the suite is evidence only if it
      # can fail. --prove reintroduces twelve real defects, including the
      # boundary widening of issue #17 and the guard-path rules of #59, and
      # requires the suite to go red for each one.
      - name: PR merge gate harness can fail
        run: node claude/hooks/pr-merge-gate.test.js --prove

      # The doc-style gate (scripts/doc-style-check.js). The commit hook in
      # .claude/settings.json is the first line. This step is the one a
      # tired session cannot skip or override, because it runs on the server
      # and ignores CLAUDE_DOC_STYLE_OVERRIDE.
      #
      # It reads the lines this change adds, not every file. About one
      # sentence in five in the older docs is over 25 words, and
      # claude/skills/end-session/SKILL.md carries 27 em dashes. A whole-repo
      # check would be red from birth, and a red check gets disabled
      # (README, principle 2). Cleaning old debt is separate work.
      - name: Doc style, lines this change adds
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE"
          fi
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null \
            || { echo "::error::cannot resolve the base '$base'; this check would be vacuous"; exit 1; }
          node scripts/doc-style-check.js --base "$base"

      - name: Doc-style gate selftest
        run: node scripts/doc-style-check.selftest.js

      # Same reason as the other selftests: the suite is evidence only if it
      # can fail. --prove injects one defect per rule and per guard. It
      # requires the suite to go red for each one.
      - name: Doc-style gate selftest can fail
        run: node scripts/doc-style-check.selftest.js --prove
