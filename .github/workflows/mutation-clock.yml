# The mutation clock: the blind-run cadence, made mandatory.
#
# The one-off blind mutation run (PR #55) measured the test layer from
# outside: agents that wrote neither the hooks nor the suites proposed
# injections, and the 15 uncaught ones became assertions. That
# measurement decays as the hooks change under it. A note that says
# "re-run it sometime" is the form with the proven failure record
# (README, principle 1), so the cadence is enforced here instead.
#
# This workflow holds the CLOCK, not the campaign. A blind run needs
# fresh reviewer agents and cannot happen inside CI. The ledger at
# claude/hooks/mutation-ledger.md records each completed run; this job
# goes red when the newest entry is older than the budget, and stays red
# until a new campaign lands a new entry. That red is a tripwire with
# mandatory consumption (README, principle 6): a green baseline, an
# owner named in the error, and this schedule as the clock.
#
# The second job re-runs every suite and every --prove pass on master on
# the same schedule, so environment rot between pushes fails here
# instead of inside the next unrelated PR.
#
# Every step fails loudly when it finds nothing to check. A clock with
# no readable start time is a vacuous green, which is worse than no
# check at all (README, principle 3).

name: Mutation clock

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  clock:
    name: Blind-run ledger age
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Newest ledger entry is inside the budget
        run: |
          set -eu
          LEDGER=claude/hooks/mutation-ledger.md
          BUDGET_DAYS=90
          [ -s "$LEDGER" ] || { echo "::error::$LEDGER is missing or empty; the clock has nothing to read"; exit 1; }
          newest=$(grep -Eo '^## [0-9]{4}-[0-9]{2}-[0-9]{2}' "$LEDGER" | sort | tail -n 1 | cut -d' ' -f2)
          [ -n "$newest" ] || { echo "::error::no '## YYYY-MM-DD' entry in $LEDGER; a clock with no start time is vacuous"; exit 1; }
          now=$(date -u +%s)
          newest_epoch=$(date -u -d "$newest" +%s)
          age=$(( (now - newest_epoch) / 86400 ))
          echo "newest blind run: $newest (${age} days ago; budget ${BUDGET_DAYS} days)"
          if [ "$age" -gt "$BUDGET_DAYS" ]; then
            echo "::error::the newest blind mutation run is ${age} days old (budget ${BUDGET_DAYS}). Owner: the next agent session in this repo. Run a fresh campaign per the method in $LEDGER and append its dated entry."
            exit 1
          fi

  suites:
    name: Suites and prove passes on master
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replay harnesses and selftests
        run: |
          set -eu
          node claude/hooks/guardrail.test.js
          bash claude/hooks/subagent-stall-check.test.sh
          node claude/hooks/session-start.selftest.js
          node claude/hooks/pr-merge-gate.test.js

      - name: Every suite can still fail
        run: |
          set -eu
          node claude/hooks/guardrail.test.js --prove
          node claude/hooks/session-start.selftest.js --prove
          node claude/hooks/pr-merge-gate.test.js --prove
