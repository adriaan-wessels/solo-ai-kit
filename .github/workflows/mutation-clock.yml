# The mutation clock: the blind-run cadence, made mandatory.
#
# The one-off blind mutation run (PR #55) measured the test layer from
# outside: agents that wrote neither the hooks nor the suites proposed
# injections, and the 15 uncaught ones became assertions. That
# measurement decays as the hooks change under it. A note that says
# "re-run it sometime" is the form with the proven failure record
# (README, principle 1), so the cadence is enforced here instead.
#
# This workflow holds the CLOCK, not the campaign. A blind run needs
# fresh reviewer agents and cannot happen inside CI. The ledger at
# .github/mutation-ledger.md records each completed run; this job goes
# red when the newest entry is older than the budget, and stays red
# until a new campaign lands a new entry.
#
# Hardened by this PR's own review round, which found four silent-green
# routes in the first cut: a non-integer budget slid through `[ -gt ]`
# under set -e as a green exit; a future-dated or fenced-example date
# reset the clock; a dated entry with nothing measured counted as a
# campaign; and the 90-day budget could never fire in a public repo
# GitHub had already gone quiet in (scheduled workflows are disabled
# after 60 days without repository activity, so the budget is now 45).
# Each of those is a loud red here now. The named residual: a repo
# dormant past 60 days stops running this clock entirely, and that is
# not observable from inside the repo.
#
# On failure this workflow files (or refreshes) a tracker issue, so the
# red lands where the agents actually look instead of relying on
# anyone's notification settings. The suites re-run lives in its own
# workflow (scheduled-suites.yml): this clock is DESIGNED to hold a
# standing red until a campaign lands, and a novel suites failure must
# never hide inside that known red (README, principle 6).

name: Mutation clock

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  clock:
    name: Blind-run ledger age
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Newest ledger entry is inside the budget
        run: |
          set -eu
          LEDGER=.github/mutation-ledger.md
          BUDGET_DAYS=45
          case "$BUDGET_DAYS" in
            ''|*[!0-9]*) echo "::error::BUDGET_DAYS='$BUDGET_DAYS' is not a positive integer; a clock with a broken dial must not read green"; exit 1;;
          esac
          [ -s "$LEDGER" ] || { echo "::error::$LEDGER is missing or empty; the clock has nothing to read"; exit 1; }
          newest=$(awk '/^```/ { fence = !fence; next } !fence' "$LEDGER" \
            | grep -E '^## [0-9]{4}-[0-9]{2}-[0-9]{2}$' | cut -d' ' -f2 | sort | tail -n 1)
          [ -n "$newest" ] || { echo "::error::no '## YYYY-MM-DD' entry outside a code fence in $LEDGER; a clock with no start time is vacuous"; exit 1; }
          now=$(date -u +%s)
          newest_epoch=$(date -u -d "$newest" +%s)
          if [ "$newest_epoch" -gt "$now" ]; then
            echo "::error::the newest ledger entry ($newest) is in the future; a forward-dated entry must not quiet the clock"
            exit 1
          fi
          age=$(( (now - newest_epoch) / 86400 ))
          echo "newest blind run: $newest (${age} days ago; budget ${BUDGET_DAYS} days)"
          awk -v d="## $newest" '
            index($0, d) == 1 { in_entry = 1; next }
            /^## / { in_entry = 0 }
            in_entry && /^- Result:/ { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$LEDGER" || { echo "::error::the newest entry ($newest) has no '- Result:' line; a date is not evidence and must not reset the clock"; exit 1; }
          if [ "$age" -gt "$BUDGET_DAYS" ]; then
            echo "::error::the newest blind mutation run is ${age} days old (budget ${BUDGET_DAYS}). Owner: the next agent session in this repo. Run a fresh campaign per the method in $LEDGER and append its dated entry."
            exit 1
          fi

      - name: File or refresh the red-clock issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          title="Mutation clock is red"
          body="Scheduled run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} . Owner: the next agent session in this repo. Remedy: run a blind campaign per the method in .github/mutation-ledger.md and append its dated entry, or fix the reported ledger error."
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
